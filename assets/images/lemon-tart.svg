<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 柠檬挞 俯视图 64x64 — 圆形挞+柠檬酱+柠檬片 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 浅薄荷绿盘子 -->
  <rect x="8" y="8" width="48" height="48" rx="24" fill="#D0E8D8" opacity="0.5"/>
  <rect x="10" y="10" width="44" height="44" rx="22" fill="#C0DCC8" opacity="0.3"/>
  <!-- 挞皮外圈（花边圆形） -->
  <rect x="12" y="12" width="40" height="40" rx="20" fill="#D4B896"/>
  <rect x="14" y="14" width="36" height="36" rx="18" fill="#D4B896"/>
  <!-- 花边齿（辐射状凸起） -->
  <rect x="16" y="10" width="4" height="4" fill="#D4B896"/>
  <rect x="26" y="9" width="4" height="4" fill="#D4B896"/>
  <rect x="36" y="9" width="4" height="4" fill="#D4B896"/>
  <rect x="44" y="10" width="4" height="4" fill="#D4B896"/>
  <rect x="8" y="24" width="4" height="4" fill="#D4B896"/>
  <rect x="8" y="36" width="4" height="4" fill="#D4B896"/>
  <rect x="52" y="24" width="4" height="4" fill="#D4B896"/>
  <rect x="52" y="36" width="4" height="4" fill="#D4B896"/>
  <rect x="16" y="50" width="4" height="4" fill="#D4B896"/>
  <rect x="26" y="51" width="4" height="4" fill="#D4B896"/>
  <rect x="36" y="51" width="4" height="4" fill="#D4B896"/>
  <rect x="44" y="50" width="4" height="4" fill="#D4B896"/>
  <!-- 挞皮内侧 -->
  <rect x="16" y="16" width="32" height="32" rx="16" fill="#C8A880"/>
  <!-- 柠檬酱馅料（圆形黄色区域） -->
  <rect x="17" y="17" width="30" height="30" rx="15" fill="#F0D878"/>
  <rect x="18" y="18" width="28" height="28" rx="14" fill="#F5E090"/>
  <!-- 柠檬酱纹理（向心纹） -->
  <rect x="24" y="18" width="1" height="12" fill="#F0D870"/>
  <rect x="31" y="18" width="1" height="12" fill="#F0D870"/>
  <rect x="38" y="18" width="1" height="12" fill="#F0D870"/>
  <rect x="20" y="26" width="12" height="1" fill="#F0D870"/>
  <rect x="20" y="32" width="12" height="1" fill="#F0D870"/>
  <rect x="32" y="26" width="12" height="1" fill="#F0D870"/>
  <rect x="32" y="32" width="12" height="1" fill="#F0D870"/>
  <!-- 中央柠檬片（装饰） -->
  <rect x="25" y="23" width="14" height="14" fill="#F5E8A0"/>
  <rect x="24" y="22" width="16" height="1" fill="#E8D068"/>
  <rect x="24" y="23" width="1" height="14" fill="#E8D068"/>
  <rect x="39" y="23" width="1" height="14" fill="#E8D068"/>
  <rect x="25" y="37" width="14" height="1" fill="#E8D068"/>
  <!-- 柠檬片辐射纹 -->
  <rect x="31" y="24" width="1" height="12" fill="#F0D878"/>
  <rect x="24" y="30" width="15" height="1" fill="#F0D878"/>
  <!-- 柠檬高光 -->
  <rect x="28" y="25" width="3" height="3" fill="#FDF0C0"/>
  <!-- 小薄荷叶 -->
  <rect x="42" y="30" width="6" height="4" fill="#7AB888"/>
  <rect x="43" y="29" width="4" height="1" fill="#6AAA78"/>
  <rect x="44" y="28" width="2" height="1" fill="#5A9868"/>
  <!-- 柠檬皮屑（散布） -->
  <rect x="20" y="20" width="2" height="1" fill="#F5E090"/>
  <rect x="40" y="20" width="2" height="1" fill="#F5E090"/>
  <rect x="38" y="42" width="2" height="1" fill="#F5E090"/>
  <rect x="22" y="40" width="2" height="1" fill="#F5E090"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 泡芙 64x64 — 酥皮纹理+奶油花+糖粉 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 垫纸 -->
  <rect x="14" y="52" width="36" height="3" fill="#F5E1E1"/>
  <rect x="16" y="51" width="32" height="1" fill="#E8D5D0"/>
  <!-- 泡芙主体（圆胖酥皮） -->
  <rect x="14" y="30" width="36" height="20" fill="#E4C090"/>
  <rect x="13" y="28" width="38" height="2" fill="#E0B888"/>
  <rect x="12" y="26" width="40" height="2" fill="#DCB480"/>
  <rect x="13" y="25" width="38" height="1" fill="#D8B078"/>
  <rect x="14" y="23" width="36" height="2" fill="#D4A870"/>
  <rect x="15" y="22" width="34" height="1" fill="#D0A468"/>
  <rect x="16" y="20" width="32" height="2" fill="#CC9C60"/>
  <rect x="17" y="19" width="30" height="1" fill="#C89858"/>
  <!-- 酥皮大裂纹 -->
  <rect x="18" y="21" width="2" height="4" fill="#C09050"/>
  <rect x="28" y="19" width="3" height="2" fill="#B88848"/>
  <rect x="40" y="22" width="2" height="3" fill="#C09050"/>
  <rect x="22" y="27" width="2" height="2" fill="#CC9858"/>
  <rect x="38" y="26" width="3" height="1" fill="#CC9858"/>
  <!-- 酥皮高光 -->
  <rect x="16" y="24" width="10" height="2" fill="#F0D4B0"/>
  <rect x="15" y="32" width="8" height="3" fill="#F0D8B8"/>
  <rect x="44" y="30" width="6" height="2" fill="#F0D4B0"/>
  <!-- 奶油挤出（顶部三大朵） -->
  <rect x="18" y="10" width="12" height="8" fill="#FFF5F0"/>
  <rect x="25" y="7" width="14" height="10" fill="#FFF5F0"/>
  <rect x="36" y="10" width="12" height="8" fill="#FFF5F0"/>
  <!-- 奶油高光 -->
  <rect x="20" y="11" width="4" height="2" fill="#FFFFFF"/>
  <rect x="28" y="8" width="8" height="2" fill="#FFFFFF"/>
  <rect x="38" y="11" width="4" height="2" fill="#FFFFFF"/>
  <!-- 糖粉散布 -->
  <rect x="19" y="10" width="2" height="1" fill="#FFFFFF"/>
  <rect x="30" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="37" y="9" width="2" height="1" fill="#FFFFFF"/>
  <rect x="24" y="9" width="1" height="2" fill="#FFFFFF"/>
  <rect x="35" y="7" width="2" height="1" fill="#FFFFFF"/>
  <rect x="16" y="10" width="1" height="1" fill="#FFFFFF"/>
  <rect x="45" y="11" width="2" height="1" fill="#FFFFFF"/>
  <!-- 小粉心 -->
  <rect x="48" y="24" width="4" height="1" fill="#E8B0C0"/>
  <rect x="47" y="25" width="6" height="1" fill="#E8B0C0"/>
  <rect x="48" y="26" width="4" height="1" fill="#E8B0C0"/>
</svg>

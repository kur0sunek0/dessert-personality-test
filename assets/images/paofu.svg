<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 泡芙 - 奶油泡芙 64x64 细致版 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 垫纸 -->
  <rect x="12" y="52" width="40" height="3" fill="#F5E1E1"/>
  <rect x="14" y="51" width="36" height="1" fill="#E8D5D0"/>
  <!-- 泡芙底部 -->
  <rect x="16" y="42" width="32" height="8" fill="#E0C090"/>
  <rect x="15" y="43" width="2" height="6" fill="#D8B888"/>
  <rect x="47" y="43" width="2" height="6" fill="#D8B888"/>
  <!-- 泡芙主体（圆胖形） -->
  <rect x="14" y="34" width="36" height="8" fill="#E8C8A0"/>
  <rect x="13" y="33" width="38" height="1" fill="#E4C498"/>
  <rect x="12" y="32" width="40" height="1" fill="#E4C498"/>
  <rect x="14" y="28" width="36" height="4" fill="#E8C8A0"/>
  <rect x="13" y="27" width="38" height="1" fill="#E4C498"/>
  <rect x="12" y="26" width="40" height="1" fill="#E4C498"/>
  <rect x="15" y="22" width="34" height="4" fill="#E8C8A0"/>
  <rect x="14" y="21" width="36" height="1" fill="#E0BC90"/>
  <rect x="15" y="20" width="34" height="1" fill="#D8B080"/>
  <rect x="16" y="18" width="32" height="2" fill="#D8B080"/>
  <rect x="17" y="17" width="30" height="1" fill="#D0A878"/>
  <rect x="18" y="16" width="28" height="1" fill="#C89860"/>
  <!-- 酥皮裂纹纹理 -->
  <rect x="18" y="20" width="2" height="3" fill="#D0A870"/>
  <rect x="28" y="18" width="2" height="2" fill="#C89860"/>
  <rect x="38" y="22" width="3" height="1" fill="#D0A870"/>
  <rect x="22" y="28" width="2" height="2" fill="#D8B888"/>
  <rect x="42" y="30" width="2" height="1" fill="#D8B888"/>
  <!-- 泡芙高光 -->
  <rect x="17" y="23" width="8" height="3" fill="#F0D8B8"/>
  <rect x="16" y="30" width="6" height="2" fill="#F0D8B8"/>
  <rect x="15" y="36" width="10" height="2" fill="#F0D8B8"/>
  <!-- 奶油挤出（顶部） -->
  <rect x="20" y="10" width="24" height="6" fill="#FFF5F0"/>
  <rect x="22" y="9" width="20" height="1" fill="#FFF5F0"/>
  <rect x="23" y="8" width="18" height="1" fill="#FFF0EB"/>
  <rect x="24" y="7" width="16" height="1" fill="#FFF0EB"/>
  <!-- 奶油花 swirl -->
  <rect x="26" y="11" width="12" height="3" fill="#FFFFFF"/>
  <rect x="28" y="10" width="8" height="1" fill="#FFFFFF"/>
  <!-- 糖粉 -->
  <rect x="22" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="30" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="38" y="9" width="2" height="1" fill="#FFFFFF"/>
  <rect x="26" y="7" width="1" height="1" fill="#FFFFFF"/>
  <rect x="34" y="12" width="2" height="1" fill="#FFFFFF"/>
  <rect x="20" y="13" width="1" height="2" fill="#FFFFFF"/>
  <rect x="42" y="13" width="2" height="1" fill="#FFFFFF"/>
  <!-- 小爱心 -->
  <rect x="46" y="24" width="3" height="1" fill="#E8A0B0"/>
  <rect x="45" y="25" width="5" height="1" fill="#E8A0B0"/>
  <rect x="46" y="26" width="3" height="1" fill="#E8A0B0"/>
  <rect x="45" y="24" width="2" height="1" fill="#F0B8C8"/>
  <rect x="48" y="24" width="2" height="1" fill="#F0B8C8"/>
</svg>

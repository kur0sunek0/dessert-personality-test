<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 原味吐司 64x64 细致版 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 木板 -->
  <rect x="10" y="54" width="44" height="3" fill="#E0C8C0"/>
  <rect x="11" y="53" width="42" height="1" fill="#D4B8B0"/>
  <rect x="12" y="56" width="40" height="2" fill="#D4B8B0"/>
  <!-- 木板纹理 -->
  <rect x="14" y="54" width="36" height="1" fill="#D4B8B0"/>
  <!-- 吐司主体 -->
  <rect x="14" y="14" width="36" height="38" fill="#F5E8D0"/>
  <!-- 面包皮（四边深色） -->
  <rect x="14" y="14" width="36" height="3" fill="#D4A070"/>
  <rect x="14" y="14" width="3" height="38" fill="#D4A070"/>
  <rect x="47" y="14" width="3" height="38" fill="#D4A070"/>
  <rect x="14" y="49" width="36" height="3" fill="#D4A070"/>
  <!-- 顶部弧度 -->
  <rect x="15" y="12" width="32" height="2" fill="#D4A070"/>
  <rect x="16" y="11" width="28" height="1" fill="#C89060"/>
  <rect x="17" y="10" width="24" height="1" fill="#C89060"/>
  <rect x="18" y="9" width="20" height="1" fill="#C08850"/>
  <!-- 面包皮高光 -->
  <rect x="17" y="14" width="30" height="1" fill="#E0B080"/>
  <rect x="14" y="17" width="1" height="30" fill="#E0B080"/>
  <!-- 面包内芯 -->
  <rect x="17" y="17" width="30" height="32" fill="#F8F0E0"/>
  <!-- 内芯海绵纹理 -->
  <rect x="19" y="22" width="26" height="1" fill="#F0E8D0"/>
  <rect x="20" y="27" width="24" height="1" fill="#F0E8D0"/>
  <rect x="18" y="32" width="28" height="1" fill="#F0E8D0"/>
  <rect x="20" y="37" width="24" height="1" fill="#F0E8D0"/>
  <rect x="19" y="42" width="26" height="1" fill="#F0E8D0"/>
  <rect x="18" y="46" width="28" height="1" fill="#F0E8D0"/>
  <!-- 气孔（面包特征） -->
  <rect x="22" y="20" width="2" height="1" fill="#E8DDC5"/>
  <rect x="30" y="23" width="1" height="1" fill="#E8DDC5"/>
  <rect x="38" y="19" width="2" height="1" fill="#E8DDC5"/>
  <rect x="26" y="28" width="2" height="1" fill="#E8DDC5"/>
  <rect x="36" y="30" width="2" height="1" fill="#E8DDC5"/>
  <rect x="24" y="35" width="1" height="1" fill="#E8DDC5"/>
  <rect x="34" y="38" width="2" height="1" fill="#E8DDC5"/>
  <rect x="28" y="43" width="2" height="1" fill="#E8DDC5"/>
  <rect x="40" y="41" width="1" height="1" fill="#E8DDC5"/>
  <!-- 黄油块 -->
  <rect x="24" y="13" width="12" height="5" fill="#F8E898"/>
  <rect x="25" y="12" width="10" height="1" fill="#F0E080"/>
  <rect x="26" y="11" width="8" height="1" fill="#E8D870"/>
  <!-- 黄油融化妆态 -->
  <rect x="27" y="17" width="6" height="2" fill="#F8E898"/>
  <rect x="28" y="19" width="4" height="1" fill="#F8E898"/>
  <rect x="34" y="18" width="2" height="1" fill="#F8E898"/>
  <!-- 黄油高光 -->
  <rect x="26" y="13" width="4" height="1" fill="#FCF0B0"/>
  <!-- 蒸汽（柔白半透明感） -->
  <rect x="22" y="4" width="3" height="3" fill="#F0E8E0" opacity="0.7"/>
  <rect x="28" y="2" width="4" height="3" fill="#F0E8E0" opacity="0.6"/>
  <rect x="36" y="4" width="3" height="3" fill="#F0E8E0" opacity="0.7"/>
  <rect x="31" y="5" width="2" height="2" fill="#F0E8E0" opacity="0.5"/>
  <!-- 内芯高光 -->
  <rect x="18" y="18" width="4" height="6" fill="#FCF8F0"/>
</svg>

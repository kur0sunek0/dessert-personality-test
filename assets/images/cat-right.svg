<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges">
  <!-- 像素小猫B：白色幼猫趴姿 + 头戴小爱心 + 眨眼 -->
  <rect x="0" y="0" width="32" height="32" fill="transparent"/>
  <!-- 尾巴（右侧翘起） -->
  <rect x="26" y="16" width="3" height="1" fill="#F0E8E0"/>
  <rect x="27" y="14" width="2" height="2" fill="#F0E8E0"/>
  <rect x="28" y="12" width="2" height="2" fill="#F0E8E0"/>
  <rect x="28" y="11" width="1" height="1" fill="#F0E8E0"/>
  <!-- 身体（趴着，横向椭圆） -->
  <rect x="8" y="20" width="16" height="6" fill="#F8F4F0"/>
  <rect x="9" y="19" width="14" height="1" fill="#F8F4F0"/>
  <!-- 肚皮毛 -->
  <rect x="10" y="23" width="12" height="3" fill="#FCFAF8"/>
  <!-- 前爪（伸向前方） -->
  <rect x="6" y="22" width="4" height="2" fill="#FCFAF8"/>
  <rect x="5" y="23" width="2" height="1" fill="#F8F4F0"/>
  <!-- 后爪 -->
  <rect x="22" y="23" width="3" height="2" fill="#F0E8E0"/>
  <!-- 头部 -->
  <rect x="9" y="10" width="13" height="10" fill="#FCFAF8"/>
  <rect x="10" y="9" width="11" height="1" fill="#FCFAF8"/>
  <rect x="11" y="8" width="9" height="1" fill="#FCFAF8"/>
  <!-- 耳朵（趴着时耳朵更侧） -->
  <rect x="8" y="5" width="4" height="4" fill="#FCFAF8"/>
  <rect x="9" y="4" width="2" height="1" fill="#FCFAF8"/>
  <rect x="20" y="6" width="4" height="3" fill="#FCFAF8"/>
  <rect x="21" y="5" width="2" height="1" fill="#FCFAF8"/>
  <!-- 耳朵内粉 -->
  <rect x="9" y="6" width="2" height="2" fill="#F8D0D8"/>
  <rect x="21" y="7" width="2" height="1" fill="#F8D0D8"/>
  <!-- 眼睛（一只眨一只圆） -->
  <!-- 左眼：圆圆 -->
  <rect x="12" y="12" width="3" height="3" fill="#3A3030"/>
  <rect x="13" y="12" width="1" height="1" fill="#FFFFFF"/>
  <!-- 右眼：眨眼中（一条线 >_<） -->
  <rect x="18" y="13" width="3" height="1" fill="#3A3030"/>
  <!-- 小鼻子 -->
  <rect x="15" y="16" width="2" height="1" fill="#F0B8C0"/>
  <!-- 微笑嘴 -->
  <rect x="14" y="17" width="1" height="1" fill="#E8C8D0"/>
  <rect x="17" y="17" width="1" height="1" fill="#E8C8D0"/>
  <rect x="15" y="18" width="2" height="1" fill="#E8C8D0"/>
  <!-- 胡须 -->
  <rect x="6" y="15" width="2" height="1" fill="#E8DDD5"/>
  <rect x="23" y="15" width="2" height="1" fill="#E8DDD5"/>
  <!-- 头上小爱心 -->
  <rect x="14" y="3" width="2" height="1" fill="#F5B7C5"/>
  <rect x="13" y="4" width="4" height="1" fill="#F5B7C5"/>
  <rect x="14" y="5" width="2" height="1" fill="#F5B7C5"/>
  <rect x="12" y="4" width="1" height="1" fill="#E8A0B0"/>
  <rect x="17" y="4" width="1" height="1" fill="#E8A0B0"/>
  <!-- 腮红 -->
  <rect x="10" y="14" width="2" height="1" fill="#FDDDE5"/>
  <rect x="20" y="14" width="2" height="1" fill="#FDDDE5"/>
  <!-- 爪垫（粉色） -->
  <rect x="7" y="24" width="1" height="1" fill="#F8D0D8"/>
  <rect x="9" y="24" width="1" height="1" fill="#F8D0D8"/>
</svg>

  <rect x="18" y="43" width="8" height="1" fill="#D0B088"/>
  <!-- 芝士主体（三角切面） -->
  <rect x="16" y="16" width="32" height="26" fill="#F5E8C8"/>
  <rect x="15" y="17" width="1" height="25" fill="#E8D8B0"/>
  <rect x="48" y="17" width="1" height="25" fill="#E8D8B0"/>
  <!-- 顶部平滑表面 -->
  <rect x="16" y="15" width="32" height="1" fill="#F0E0B8"/>
  <rect x="17" y="14" width="30" height="1" fill="#ECD8B0"/>
  <rect x="18" y="16" width="8" height="2" fill="#F8F0E0"/>
  <!-- 芝士纹理层 -->
  <rect x="17" y="22" width="30" height="1" fill="#F0E0C0"/>
  <rect x="17" y="28" width="30" height="1" fill="#F0E0C0"/>
  <rect x="17" y="34" width="30" height="1" fill="#F0E0C0"/>
  <rect x="17" y="38" width="30" height="1" fill="#F0E0C0"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 芝士乳酪蛋糕 64x64 三角切面 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 盘子 -->
  <rect x="10" y="52" width="44" height="3" fill="#F5E1E1"/>
  <rect x="12" y="51" width="40" height="1" fill="#E8D5D0"/>
  <!-- 饼干底（厚+颗粒纹理） -->
  <rect x="16" y="43" width="32" height="7" fill="#C09868"/>
  <rect x="15" y="42" width="34" height="1" fill="#B08858"/>
  <rect x="17" y="46" width="30" height="1" fill="#B08858"/>
  <rect x="17" y="49" width="30" height="1" fill="#B08858"/>
  <!-- 饼干颗粒 -->
  <rect x="18" y="44" width="2" height="1" fill="#A88050"/>
  <rect x="25" y="45" width="3" height="1" fill="#A88050"/>
  <rect x="32" y="44" width="2" height="1" fill="#A88050"/>
  <rect x="40" y="45" width="2" height="1" fill="#A88050"/>
  <rect x="20" y="48" width="3" height="1" fill="#A88050"/>
  <rect x="36" y="47" width="2" height="1" fill="#A88050"/>
  <rect x="28" y="44" width="2" height="1" fill="#B89860"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 芝士乳酪蛋糕 64x64 细致版 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 盘子 -->
  <rect x="10" y="52" width="44" height="3" fill="#F5E1E1"/>
  <rect x="12" y="51" width="40" height="1" fill="#E8D5D0"/>
  <!-- 饼干底（厚实+纹理） -->
  <rect x="16" y="42" width="32" height="8" fill="#C8A070"/>
  <rect x="15" y="41" width="34" height="1" fill="#B89060"/>
  <rect x="17" y="45" width="30" height="1" fill="#B89060"/>
  <rect x="16" y="48" width="32" height="1" fill="#B89060"/>
  <!-- 饼干底颗粒纹理 -->
  <rect x="18" y="43" width="2" height="1" fill="#B08858"/>
  <rect x="24" y="44" width="2" height="1" fill="#B08858"/>
  <rect x="32" y="43" width="2" height="1" fill="#B08858"/>
  <rect x="40" y="44" width="3" height="1" fill="#B08858"/>
  <rect x="20" y="47" width="2" height="1" fill="#B08858"/>
  <rect x="36" y="46" width="2" height="1" fill="#B08858"/>
  <!-- 饼干底高光 -->
  <rect x="18" y="42" width="6" height="1" fill="#D8B890"/>
  <!-- 芝士主体（三角切片侧面） -->
  <rect x="16" y="16" width="32" height="25" fill="#F5E8C8"/>
  <!-- 顶部平滑表面 -->
  <rect x="16" y="15" width="32" height="1" fill="#F0E0B8"/>
  <rect x="17" y="14" width="30" height="1" fill="#ECD8B0"/>
  <!-- 侧面深度感 -->
  <rect x="15" y="17" width="1" height="24" fill="#E8D8B0"/>
  <rect x="48" y="17" width="1" height="24" fill="#E8D8B0"/>
  <!-- 芝士纹理层 -->
  <rect x="17" y="22" width="30" height="1" fill="#F0E0C0"/>
  <rect x="17" y="28" width="30" height="1" fill="#F0E0C0"/>
  <rect x="17" y="34" width="30" height="1" fill="#F0E0C0"/>
  <rect x="17" y="38" width="30" height="1" fill="#F0E0C0"/>
  <!-- 顶部高光（光滑质感） -->
  <rect x="18" y="15" width="14" height="1" fill="#F8F0E0"/>
  <rect x="19" y="16" width="6" height="2" fill="#F8F0E0"/>
  <!-- 叉子 -->
  <rect x="48" y="18" width="2" height="20" fill="#D0CCC4"/>
  <rect x="47" y="18" width="1" height="1" fill="#E0DCD4"/>
  <rect x="51" y="18" width="1" height="1" fill="#E0DCD4"/>
  <rect x="46" y="19" width="1" height="1" fill="#D0CCC4"/>
  <rect x="52" y="19" width="1" height="1" fill="#D0CCC4"/>
  <!-- 叉齿 -->
  <rect x="46" y="36" width="1" height="3" fill="#D0CCC4"/>
  <rect x="48" y="36" width="1" height="3" fill="#D0CCC4"/>
  <rect x="50" y="36" width="1" height="3" fill="#D0CCC4"/>
  <rect x="52" y="36" width="1" height="3" fill="#D0CCC4"/>
  <!-- 叉子高光 -->
  <rect x="49" y="22" width="1" height="6" fill="#E8E4DC"/>
</svg>

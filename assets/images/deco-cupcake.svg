<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="192" height="192" shape-rendering="crispEdges">
  <!-- 纸杯蛋糕 - 首页装饰左上 -->
  <rect x="0" y="0" width="48" height="48" fill="transparent"/>
  <!-- 纸杯 -->
  <rect x="12" y="30" width="24" height="14" fill="#F0C8D0"/>
  <rect x="13" y="29" width="22" height="1" fill="#E8B8C0"/>
  <!-- 纸杯褶皱纹理 -->
  <rect x="13" y="33" width="22" height="1" fill="#E8B8C0"/>
  <rect x="14" y="36" width="20" height="1" fill="#E8B8C0"/>
  <rect x="13" y="39" width="22" height="1" fill="#E8B8C0"/>
  <rect x="14" y="42" width="20" height="1" fill="#E8B8C0"/>
  <!-- 蛋糕体 -->
  <rect x="12" y="24" width="24" height="5" fill="#F5E0C0"/>
  <rect x="13" y="23" width="22" height="1" fill="#F0D8B0"/>
  <!-- 奶油顶 -->
  <rect x="10" y="16" width="28" height="7" fill="#FFF5F0"/>
  <rect x="11" y="15" width="26" height="1" fill="#FFF5F0"/>
  <rect x="12" y="14" width="24" height="1" fill="#FFF0EB"/>
  <rect x="14" y="13" width="20" height="1" fill="#FFF0EB"/>
  <rect x="16" y="12" width="16" height="1" fill="#FFF0EB"/>
  <!-- 奶油螺旋纹 -->
  <rect x="14" y="18" width="20" height="1" fill="#FFEDE5"/>
  <rect x="16" y="20" width="16" height="1" fill="#FFEDE5"/>
  <!-- 樱桃 -->
  <rect x="20" y="5" width="8" height="7" fill="#D04040"/>
  <rect x="21" y="4" width="6" height="1" fill="#C03030"/>
  <rect x="22" y="3" width="4" height="1" fill="#B82828"/>
  <!-- 樱桃高光 -->
  <rect x="22" y="6" width="2" height="2" fill="#E86060"/>
  <!-- 樱桃梗 -->
  <rect x="23" y="1" width="2" height="2" fill="#6AAA50"/>
  <rect x="24" y="0" width="2" height="1" fill="#5A9840"/>
  <!-- 彩糖粒 -->
  <rect x="16" y="15" width="2" height="2" fill="#F5B7C5"/>
  <rect x="30" y="16" width="2" height="2" fill="#A0D8D0"/>
  <rect x="22" y="14" width="2" height="2" fill="#FFE8A0"/>
  <rect x="28" y="14" width="2" height="1" fill="#D0A0C8"/>
  <!-- 高光 -->
  <rect x="16" y="25" width="6" height="2" fill="#F8E8D0"/>
</svg>

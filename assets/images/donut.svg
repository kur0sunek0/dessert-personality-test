<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 甜甜圈 俯视图 64x64 — 环形+圆洞+糖霜+彩糖粒 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 底影 -->
  <rect x="8" y="48" width="48" height="3" fill="#F5E1E1"/>
  <rect x="10" y="47" width="44" height="1" fill="#E8D5D0"/>
  <!-- 面团外圈（俯视环形） -->
  <rect x="7" y="12" width="50" height="36" fill="#E8C090"/>
  <rect x="8" y="11" width="48" height="1" fill="#E0B888"/>
  <rect x="9" y="10" width="46" height="1" fill="#D8B080"/>
  <rect x="7" y="13" width="1" height="34" fill="#E0B888"/>
  <rect x="56" y="13" width="1" height="34" fill="#E0B888"/>
  <rect x="8" y="47" width="48" height="1" fill="#E0B888"/>
  <!-- 中间圆洞 -->
  <rect x="22" y="22" width="20" height="16" fill="transparent"/>
  <rect x="23" y="21" width="18" height="1" fill="transparent"/>
  <rect x="24" y="20" width="16" height="1" fill="transparent"/>
  <rect x="25" y="19" width="14" height="1" fill="transparent"/>
  <rect x="21" y="23" width="1" height="14" fill="transparent"/>
  <rect x="42" y="23" width="1" height="14" fill="transparent"/>
  <rect x="23" y="37" width="18" height="1" fill="transparent"/>
  <rect x="24" y="38" width="16" height="1" fill="transparent"/>
  <!-- 洞周面团阴影 -->
  <rect x="21" y="22" width="1" height="16" fill="#D8B080"/>
  <rect x="42" y="22" width="1" height="16" fill="#D8B080"/>
  <rect x="22" y="21" width="20" height="1" fill="#D8B080"/>
  <rect x="22" y="37" width="20" height="1" fill="#D0A870"/>
  <!-- 粉色糖霜（覆盖上半部分面团） -->
  <rect x="8" y="10" width="48" height="14" fill="#F0B8C8"/>
  <rect x="7" y="11" width="1" height="12" fill="#E8A8B8"/>
  <rect x="55" y="11" width="1" height="12" fill="#E8A8B8"/>
  <rect x="9" y="9" width="46" height="1" fill="#E8A0B0"/>
  <!-- 糖霜内侧弧（洞边） -->
  <rect x="22" y="14" width="5" height="4" fill="#F0B8C8"/>
  <rect x="37" y="14" width="5" height="4" fill="#F0B8C8"/>
  <rect x="27" y="10" width="10" height="3" fill="#F0B8C8"/>
  <!-- 糖霜滴落 -->
  <rect x="14" y="23" width="5" height="4" fill="#F0B8C8"/>
  <rect x="28" y="24" width="4" height="3" fill="#F0B8C8"/>
  <rect x="44" y="23" width="6" height="4" fill="#F0B8C8"/>
  <rect x="36" y="25" width="3" height="2" fill="#F0B8C8"/>
  <!-- 糖霜高光 -->
  <rect x="11" y="10" width="14" height="1" fill="#FCC8D8"/>
  <rect x="30" y="10" width="10" height="1" fill="#FCC8D8"/>
  <rect x="44" y="10" width="8" height="1" fill="#FCC8D8"/>
  <!-- 彩糖粒（丰富散布） -->
  <rect x="13" y="11" width="3" height="3" fill="#FFE8A0"/>
  <rect x="20" y="12" width="2" height="2" fill="#A0D8D0"/>
  <rect x="26" y="11" width="2" height="2" fill="#D0A0C8"/>
  <rect x="33" y="12" width="3" height="3" fill="#FFE8A0"/>
  <rect x="40" y="11" width="2" height="2" fill="#A0D8D0"/>
  <rect x="48" y="12" width="2" height="2" fill="#D0A0C8"/>
  <rect x="16" y="13" width="2" height="2" fill="#D0A0C8"/>
  <rect x="30" y="13" width="2" height="1" fill="#FFE8A0"/>
  <rect x="36" y="13" width="2" height="2" fill="#A0D8D0"/>
  <rect x="43" y="13" width="2" height="1" fill="#FFE8A0"/>
  <rect x="10" y="12" width="1" height="2" fill="#A0D8D0"/>
  <rect x="53" y="11" width="1" height="2" fill="#D0A0C8"/>
  <rect x="22" y="10" width="2" height="1" fill="#FFE8A0"/>
  <!-- 面团可见部分（无糖霜覆盖的下半部） -->
  <rect x="10" y="27" width="44" height="20" fill="#E8C8A0"/>
  <rect x="11" y="28" width="42" height="1" fill="#F0D8B8"/>
  <!-- 面团高光 -->
  <rect x="16" y="32" width="12" height="2" fill="#F0D8B8"/>
  <rect x="38" y="35" width="10" height="2" fill="#F0D8B8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 甜甜圈 64x64 细致版 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 垫纸 -->
  <rect x="12" y="50" width="40" height="3" fill="#F5E1E1"/>
  <rect x="14" y="49" width="36" height="1" fill="#E8D5D0"/>
  <!-- 甜甜圈底影 -->
  <rect x="14" y="46" width="36" height="3" fill="#E0C8A0"/>
  <!-- 面团主体（环形） -->
  <rect x="10" y="20" width="44" height="26" fill="#E8C8A0"/>
  <rect x="11" y="19" width="42" height="1" fill="#E4C498"/>
  <rect x="12" y="18" width="40" height="1" fill="#E0BC90"/>
  <rect x="9" y="21" width="1" height="24" fill="#E0BC90"/>
  <rect x="54" y="21" width="1" height="24" fill="#E0BC90"/>
  <!-- 中间洞 -->
  <rect x="22" y="30" width="20" height="6" fill="transparent"/>
  <rect x="23" y="29" width="18" height="1" fill="transparent"/>
  <!-- 洞周阴影 -->
  <rect x="21" y="30" width="1" height="6" fill="#D8B888"/>
  <rect x="42" y="30" width="1" height="6" fill="#D8B888"/>
  <rect x="22" y="36" width="20" height="1" fill="#D8B888"/>
  <!-- 粉色糖霜 -->
  <rect x="11" y="17" width="42" height="5" fill="#F0B8C8"/>
  <rect x="10" y="18" width="1" height="4" fill="#E8A8B8"/>
  <rect x="53" y="18" width="1" height="4" fill="#E8A8B8"/>
  <rect x="12" y="16" width="40" height="1" fill="#E8A8B8"/>
  <!-- 糖霜滴落 -->
  <rect x="15" y="22" width="4" height="3" fill="#F0B8C8"/>
  <rect x="25" y="22" width="3" height="2" fill="#F0B8C8"/>
  <rect x="40" y="22" width="5" height="3" fill="#F0B8C8"/>
  <rect x="50" y="22" width="3" height="2" fill="#F0B8C8"/>
  <!-- 糖霜高光 -->
  <rect x="14" y="17" width="8" height="1" fill="#FCC8D8"/>
  <rect x="30" y="17" width="6" height="1" fill="#FCC8D8"/>
  <rect x="42" y="17" width="6" height="1" fill="#FCC8D8"/>
  <!-- 彩糖粒（更多更丰富） -->
  <rect x="16" y="18" width="2" height="2" fill="#FFE8A0"/>
  <rect x="22" y="18" width="2" height="2" fill="#A0D8D0"/>
  <rect x="28" y="17" width="2" height="2" fill="#FFE8A0"/>
  <rect x="34" y="18" width="1" height="1" fill="#D0A0C8"/>
  <rect x="38" y="17" width="2" height="2" fill="#A0D8D0"/>
  <rect x="44" y="18" width="2" height="2" fill="#D0A0C8"/>
  <rect x="20" y="17" width="1" height="1" fill="#D0A0C8"/>
  <rect x="32" y="19" width="2" height="1" fill="#FFE8A0"/>
  <rect x="48" y="18" width="1" height="1" fill="#A0D8D0"/>
  <rect x="14" y="19" width="1" height="1" fill="#FFE8A0"/>
  <rect x="41" y="18" width="1" height="1" fill="#FFE8A0"/>
  <rect x="26" y="19" width="2" height="1" fill="#D0A0C8"/>
  <!-- 面团高光 -->
  <rect x="14" y="23" width="4" height="2" fill="#F0D8B8"/>
  <rect x="46" y="28" width="4" height="2" fill="#F0D8B8"/>
</svg>

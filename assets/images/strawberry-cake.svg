<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 草莓奶油蛋糕 64x64 切面三层 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 盘子 -->
  <rect x="8" y="54" width="48" height="3" fill="#F5E1E1"/>
  <rect x="10" y="53" width="44" height="1" fill="#E8D5D0"/>
  <!-- 底蛋糕层（香草） -->
  <rect x="14" y="44" width="36" height="7" fill="#F5DEB8"/>
  <rect x="15" y="43" width="34" height="1" fill="#F0D8B0"/>
  <rect x="16" y="47" width="32" height="1" fill="#F0D4A8"/>
  <!-- 奶油夹层1 + 草莓切片 -->
  <rect x="14" y="39" width="36" height="4" fill="#FFF5F0"/>
  <rect x="15" y="38" width="34" height="1" fill="#FFEDE5"/>
  <rect x="18" y="40" width="8" height="2" fill="#E8787A"/>
  <rect x="32" y="40" width="8" height="2" fill="#E8787A"/>
  <rect x="44" y="40" width="4" height="2" fill="#E8787A"/>
  <!-- 中蛋糕层（淡粉色草莓海绵） -->
  <rect x="15" y="31" width="34" height="7" fill="#F2CED0"/>
  <rect x="16" y="30" width="32" height="1" fill="#EDC4C6"/>
  <rect x="17" y="34" width="30" height="1" fill="#EDBEC0"/>
  <!-- 奶油夹层2 -->
  <rect x="15" y="26" width="34" height="4" fill="#FFF5F0"/>
  <rect x="16" y="25" width="32" height="1" fill="#FFEDE5"/>
  <!-- 顶蛋糕层 -->
  <rect x="16" y="19" width="32" height="6" fill="#F5DEB8"/>
  <rect x="17" y="18" width="30" height="1" fill="#F0D8B0"/>
  <!-- 顶部奶油裱花 -->
  <rect x="16" y="14" width="32" height="4" fill="#FFF5F0"/>
  <rect x="15" y="15" width="34" height="1" fill="#FFFFFF"/>
  <!-- 波浪花边 -->
  <rect x="16" y="16" width="4" height="2" fill="#FFFFFF"/>
  <rect x="22" y="16" width="4" height="2" fill="#FFFFFF"/>
  <rect x="28" y="16" width="4" height="2" fill="#FFFFFF"/>
  <rect x="34" y="16" width="4" height="2" fill="#FFFFFF"/>
  <rect x="40" y="16" width="4" height="2" fill="#FFFFFF"/>
  <!-- 顶部大草莓 -->
  <rect x="24" y="3" width="16" height="11" fill="#E06062"/>
  <rect x="25" y="2" width="14" height="1" fill="#D05052"/>
  <rect x="27" y="1" width="10" height="1" fill="#C04042"/>
  <rect x="28" y="0" width="8" height="1" fill="#B8383A"/>
  <!-- 草莓叶 -->
  <rect x="24" y="2" width="3" height="1" fill="#6AAA78"/>
  <rect x="37" y="2" width="3" height="1" fill="#6AAA78"/>
  <rect x="28" y="0" width="2" height="1" fill="#7AB888"/>
  <rect x="34" y="0" width="2" height="1" fill="#7AB888"/>
  <!-- 草莓籽 -->
  <rect x="26" y="5" width="2" height="1" fill="#FFC8C8"/>
  <rect x="30" y="6" width="1" height="1" fill="#FFC8C8"/>
  <rect x="34" y="5" width="2" height="1" fill="#FFC8C8"/>
  <rect x="27" y="8" width="2" height="1" fill="#FFC8C8"/>
  <rect x="36" y="8" width="1" height="1" fill="#FFC8C8"/>
  <rect x="28" y="10" width="2" height="1" fill="#FFC8C8"/>
  <rect x="33" y="11" width="2" height="1" fill="#FFC8C8"/>
  <!-- 草莓高光 -->
  <rect x="28" y="4" width="4" height="2" fill="#F08080"/>
  <!-- 蛋糕侧面高光 -->
  <rect x="18" y="20" width="8" height="2" fill="#F8E8D0"/>
  <rect x="18" y="33" width="6" height="2" fill="#F8E0E0"/>
  <rect x="18" y="46" width="10" height="2" fill="#F8E8D0"/>
  <!-- 侧面奶油花装饰 -->
  <rect x="10" y="30" width="4" height="5" fill="#FFF5F0"/>
  <rect x="50" y="33" width="4" height="5" fill="#FFF5F0"/>
</svg>

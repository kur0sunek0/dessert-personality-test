<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 焦糖烤布蕾 64x64 微俯视 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 小盘子 -->
  <rect x="10" y="50" width="44" height="3" fill="#F5E1E1"/>
  <rect x="12" y="49" width="40" height="1" fill="#E8D5D0"/>
  <!-- 烤盅椭圆口（微俯视） -->
  <rect x="14" y="28" width="36" height="20" fill="#FFF8F5"/>
  <rect x="13" y="29" width="2" height="18" fill="#F0E5E0"/>
  <rect x="49" y="29" width="2" height="18" fill="#F0E5E0"/>
  <rect x="15" y="47" width="34" height="1" fill="#F0E5E0"/>
  <rect x="15" y="48" width="34" height="1" fill="#EDE0D8"/>
  <!-- 烤盅纹理环 -->
  <rect x="14" y="30" width="36" height="1" fill="#F5EDE8"/>
  <rect x="14" y="38" width="36" height="1" fill="#F5EDE8"/>
  <!-- 布蕾表面（焦糖层椭圆） -->
  <rect x="16" y="24" width="32" height="4" fill="#E0C8A0"/>
  <rect x="17" y="23" width="30" height="1" fill="#D8B888"/>
  <rect x="18" y="22" width="28" height="1" fill="#D0A870"/>
  <!-- 焦糖琥珀层（中央深色） -->
  <rect x="18" y="18" width="28" height="4" fill="#C89050"/>
  <rect x="19" y="17" width="26" height="1" fill="#B88040"/>
  <rect x="20" y="16" width="24" height="1" fill="#B07838"/>
  <!-- 焦糖高光 -->
  <rect x="20" y="18" width="10" height="1" fill="#E0B070"/>
  <rect x="32" y="18" width="6" height="1" fill="#E0B070"/>
  <rect x="21" y="17" width="6" height="1" fill="#D4A868"/>
  <!-- 焦糖裂纹（多条） -->
  <rect x="22" y="18" width="1" height="2" fill="#A07030"/>
  <rect x="28" y="17" width="1" height="3" fill="#986828"/>
  <rect x="34" y="19" width="2" height="1" fill="#A07030"/>
  <rect x="25" y="16" width="1" height="2" fill="#986828"/>
  <rect x="38" y="17" width="1" height="2" fill="#A07030"/>
  <rect x="20" y="19" width="2" height="1" fill="#B08040"/>
  <rect x="30" y="20" width="3" height="1" fill="#B88848"/>
  <rect x="40" y="18" width="1" height="1" fill="#A07030"/>
  <!-- 焦糖边缘鼓泡 -->
  <rect x="17" y="20" width="2" height="1" fill="#D4A060"/>
  <rect x="46" y="20" width="2" height="1" fill="#D4A060"/>
  <!-- 金属勺子（侧放） -->
  <rect x="48" y="16" width="2" height="14" fill="#D0CCC4"/>
  <rect x="47" y="16" width="1" height="2" fill="#E0DCD4"/>
  <rect x="51" y="16" width="1" height="2" fill="#E0DCD4"/>
  <rect x="47" y="20" width="1" height="4" fill="#D0CCC4"/>
  <rect x="51" y="20" width="1" height="4" fill="#D0CCC4"/>
  <rect x="46" y="22" width="2" height="1" fill="#E0DCD4"/>
  <rect x="52" y="22" width="1" height="2" fill="#E0DCD4"/>
  <rect x="49" y="20" width="1" height="5" fill="#E8E4DC"/>
  <!-- 烤盅高光 -->
  <rect x="16" y="33" width="3" height="10" fill="#FFFCFA"/>
</svg>

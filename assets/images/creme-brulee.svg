<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 焦糖烤布蕾 64x64 细致版 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 小盘子 -->
  <rect x="10" y="50" width="44" height="3" fill="#F5E1E1"/>
  <rect x="12" y="49" width="40" height="1" fill="#E8D5D0"/>
  <!-- 烤盅 -->
  <rect x="14" y="30" width="36" height="19" fill="#FFF8F5"/>
  <rect x="15" y="29" width="34" height="1" fill="#F5EDE8"/>
  <rect x="13" y="31" width="1" height="17" fill="#F0E5E0"/>
  <rect x="50" y="31" width="1" height="17" fill="#F0E5E0"/>
  <rect x="14" y="49" width="36" height="1" fill="#F0E5E0"/>
  <!-- 烤盅纹理 -->
  <rect x="15" y="35" width="34" height="1" fill="#F5EDE8"/>
  <rect x="15" y="40" width="34" height="1" fill="#F5EDE8"/>
  <rect x="15" y="45" width="34" height="1" fill="#F5EDE8"/>
  <!-- 烤盅高光 -->
  <rect x="16" y="32" width="3" height="12" fill="#FFFCFA"/>
  <!-- 布蕾主体（奶黄色） -->
  <rect x="16" y="25" width="32" height="4" fill="#F5E0C0"/>
  <rect x="17" y="24" width="30" height="1" fill="#F0D8B0"/>
  <!-- 焦糖表面（琥珀色） -->
  <rect x="15" y="20" width="34" height="4" fill="#D4A060"/>
  <rect x="16" y="19" width="32" height="1" fill="#C89050"/>
  <rect x="17" y="18" width="30" height="1" fill="#C08848"/>
  <!-- 焦糖高光 -->
  <rect x="17" y="20" width="10" height="1" fill="#E0B870"/>
  <rect x="30" y="20" width="6" height="1" fill="#E0B870"/>
  <rect x="18" y="19" width="6" height="1" fill="#D4A868"/>
  <!-- 焦糖裂纹 -->
  <rect x="22" y="20" width="1" height="2" fill="#B08040"/>
  <rect x="28" y="19" width="1" height="2" fill="#A87838"/>
  <rect x="35" y="21" width="1" height="1" fill="#B08040"/>
  <rect x="20" y="18" width="2" height="1" fill="#B08040"/>
  <rect x="38" y="19" width="1" height="2" fill="#A87838"/>
  <rect x="25" y="21" width="2" height="1" fill="#C09050"/>
  <!-- 金属小勺子 -->
  <rect x="48" y="16" width="2" height="16" fill="#D0CCC4"/>
  <rect x="47" y="16" width="1" height="2" fill="#D0CCC4"/>
  <rect x="51" y="16" width="1" height="2" fill="#D0CCC4"/>
  <rect x="47" y="20" width="1" height="3" fill="#E0DCD4"/>
  <rect x="51" y="20" width="1" height="3" fill="#E0DCD4"/>
  <rect x="46" y="22" width="1" height="4" fill="#E0DCD4"/>
  <rect x="52" y="22" width="1" height="4" fill="#E0DCD4"/>
  <rect x="45" y="25" width="1" height="2" fill="#E0DCD4"/>
  <rect x="53" y="25" width="1" height="2" fill="#E0DCD4"/>
  <rect x="48" y="18" width="2" height="1" fill="#E8E4DC"/>
  <!-- 勺子高光 -->
  <rect x="49" y="20" width="1" height="4" fill="#E8E4DC"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- 精致多层草莓奶油蛋糕 - 首页中间展示 -->
  <rect x="0" y="0" width="64" height="64" fill="transparent"/>
  <!-- 盘子 -->
  <rect x="8" y="52" width="48" height="3" fill="#F5E1E1"/>
  <rect x="10" y="51" width="44" height="1" fill="#E8D5D0"/>
  <rect x="6" y="53" width="52" height="2" fill="#F0D8D0"/>
  <!-- 底层蛋糕 -->
  <rect x="12" y="44" width="40" height="8" fill="#F5DEB8"/>
  <rect x="13" y="43" width="38" height="1" fill="#F0D8B0"/>
  <!-- 底层纹理 -->
  <rect x="14" y="47" width="36" height="1" fill="#F0D4A8"/>
  <rect x="14" y="50" width="36" height="1" fill="#F0D4A8"/>
  <!-- 底层奶油夹层 -->
  <rect x="12" y="40" width="40" height="3" fill="#FFF5F0"/>
  <rect x="13" y="39" width="38" height="1" fill="#FFEDE5"/>
  <!-- 草莓切片（夹层中） -->
  <rect x="18" y="41" width="6" height="2" fill="#E8888A"/>
  <rect x="30" y="41" width="6" height="2" fill="#E8888A"/>
  <rect x="42" y="41" width="4" height="2" fill="#E8888A"/>
  <!-- 中层蛋糕 -->
  <rect x="13" y="32" width="38" height="7" fill="#F8E8D0"/>
  <rect x="14" y="31" width="36" height="1" fill="#F5E0C5"/>
  <rect x="15" y="35" width="34" height="1" fill="#F3DCC0"/>
  <!-- 中层奶油 -->
  <rect x="13" y="28" width="38" height="3" fill="#FFF5F0"/>
  <rect x="14" y="27" width="36" height="1" fill="#FFF0EB"/>
  <!-- 上层蛋糕 -->
  <rect x="15" y="21" width="34" height="6" fill="#F5DEB8"/>
  <rect x="16" y="20" width="32" height="1" fill="#F0D8B0"/>
  <!-- 顶部奶油裱花 -->
  <rect x="15" y="16" width="34" height="4" fill="#FFF5F0"/>
  <!-- 奶油花边（波浪） -->
  <rect x="14" y="17" width="2" height="3" fill="#FFF5F0"/>
  <rect x="18" y="15" width="4" height="1" fill="#FFF5F0"/>
  <rect x="24" y="15" width="4" height="1" fill="#FFF5F0"/>
  <rect x="30" y="15" width="4" height="1" fill="#FFF5F0"/>
  <rect x="36" y="15" width="4" height="1" fill="#FFF5F0"/>
  <rect x="42" y="15" width="4" height="1" fill="#FFF5F0"/>
  <rect x="48" y="17" width="2" height="3" fill="#FFF5F0"/>
  <!-- 顶部草莓 -->
  <rect x="27" y="7" width="10" height="9" fill="#E07072"/>
  <rect x="28" y="6" width="8" height="1" fill="#D06062"/>
  <rect x="29" y="5" width="6" height="1" fill="#C05052"/>
  <rect x="30" y="4" width="4" height="1" fill="#B8484A"/>
  <!-- 草莓叶子 -->
  <rect x="28" y="6" width="2" height="1" fill="#6AAA78"/>
  <rect x="34" y="6" width="2" height="1" fill="#6AAA78"/>
  <rect x="30" y="4" width="1" height="1" fill="#7AB888"/>
  <rect x="33" y="4" width="1" height="1" fill="#7AB888"/>
  <!-- 草莓籽 -->
  <rect x="29" y="9" width="1" height="1" fill="#FFD0D0"/>
  <rect x="32" y="10" width="1" height="1" fill="#FFD0D0"/>
  <rect x="34" y="9" width="1" height="1" fill="#FFD0D0"/>
  <rect x="30" y="12" width="1" height="1" fill="#FFD0D0"/>
  <rect x="33" y="13" width="1" height="1" fill="#FFD0D0"/>
  <!-- 侧面奶油裱花 -->
  <rect x="10" y="32" width="3" height="4" fill="#FFF5F0"/>
  <rect x="51" y="32" width="3" height="4" fill="#FFF5F0"/>
  <rect x="10" y="24" width="3" height="3" fill="#FFF5F0"/>
  <rect x="51" y="24" width="3" height="3" fill="#FFF5F0"/>
  <!-- 蝴蝶结（顶部） -->
  <rect x="24" y="14" width="2" height="2" fill="#F5B7C5"/>
  <rect x="38" y="14" width="2" height="2" fill="#F5B7C5"/>
  <rect x="22" y="13" width="20" height="1" fill="#F5B7C5"/>
  <rect x="26" y="15" width="12" height="1" fill="#E8A0B0"/>
  <!-- 高光 -->
  <rect x="17" y="22" width="6" height="2" fill="#F8ECD8"/>
  <rect x="14" y="34" width="4" height="2" fill="#FCF0E0"/>
  <rect x="15" y="46" width="8" height="2" fill="#F8E8D0"/>
  <!-- 散落糖粒 -->
  <rect x="7" y="48" width="2" height="2" fill="#FFE8A0"/>
  <rect x="55" y="50" width="2" height="2" fill="#F0C0D0"/>
  <rect x="8" y="52" width="1" height="1" fill="#A0D8D0"/>
</svg>
